<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECE Class Daily Excel Report Bulk Exporter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-6 font-sans">

    <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-xl border border-slate-200 mt-10">
        <div class="border-b-2 border-indigo-600 pb-4 mb-6">
            <span class="bg-indigo-100 text-indigo-800 text-xs font-bold uppercase px-3 py-1 rounded-full">ECE Department Tracker</span>
            <h1 class="text-2xl font-black tracking-tight text-slate-900 mt-2">Bulk Excel Daily Log Report Generator</h1>
            <p class="text-slate-500 text-sm mt-1">Upload your master enrollment sheet to generate a multi-day chronological course progress sheet downloadable directly as a formatted Excel spreadsheet.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="md:col-span-3 bg-slate-50 p-4 rounded-xl border border-dashed border-slate-300">
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">1. Select Your Master Excel File</label>
                <input type="file" id="uploadFile" accept=".xlsx, .xls, .csv" class="w-full text-sm file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 file:cursor-pointer"/>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">2. Tracking From Date</label>
                <input type="date" id="fromDate" value="2026-05-18" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">3. Tracking To Date</label>
                <input type="date" id="toDate" value="2026-05-20" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">4. Target Course Domain</label>
                <select id="courseFilter" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white" disabled>
                    <option value="All">All Registered Courses</option>
                </select>
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">5. Student Filter Profile</label>
            <select id="studentFilter" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white" disabled>
                <option value="All">All Students (Compiles structured chronological day-by-day logs)</option>
            </select>
        </div>

        <button id="exportExcelBtn" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition duration-200 uppercase tracking-wider text-xs flex justify-center items-center gap-2 disabled:opacity-50" disabled>
            💾 Process & Download Formatted Excel Report
        </button>
    </div>

    <script>
        let masterSheetData = [];

        // Map column tags exactly to match your provided document structure
        const COL_NAME = "Name of The Student";
        const COL_ROLL = "Roll Number";
        const COL_YEAR_SEC = "Year & Section";
        const COL_MAIL = "Mail ID";
        const COL_PHONE = "Mobile Number";
        const COL_COURSE = "Online Certification Courses";
        const COL_SDG = "Case Study on SDG (Sustainable Development Course) Topics Related to ECE";

        document.getElementById('uploadFile').addEventListener('change', readMasterExcel, false);
        document.getElementById('exportExcelBtn').addEventListener('click', processAndDownloadExcel, false);

        // 1. Parse Uploaded Input Document
        function readMasterExcel(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            const file = files[0];

            const reader = new FileReader();
            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const targetSheet = workbook.Sheets[workbook.SheetNames[0]];
                
                masterSheetData = XLSX.utils.sheet_to_json(targetSheet, {defval: ""});

                if(masterSheetData.length === 0) {
                    alert("Error parsing document. File appears to have missing dataset layouts.");
                    return;
                }

                activateControls(masterSheetData);
            };
            reader.readAsArrayBuffer(file);
        }

        // 2. Load Select Controls
        function activateControls(data) {
            const courses = new Set();
            const students = new Set();

            data.forEach(row => {
                if (row[COL_COURSE]) courses.add(String(row[row[COL_COURSE] ? COL_COURSE : '']).trim());
                if (row[COL_NAME]) students.add(String(row[COL_NAME]).trim());
            });

            const cMenu = document.getElementById('courseFilter');
            cMenu.innerHTML = '<option value="All">All Registered Courses</option>';
            courses.forEach(c => { if(c) cMenu.innerHTML += `<option value="${c}">${c}</option>`; });
            cMenu.disabled = false;

            const sMenu = document.getElementById('studentFilter');
            sMenu.innerHTML = '<option value="All">All Students (Compiles structured chronological day-by-day logs)</option>';
            students.forEach(s => { if(s) sMenu.innerHTML += `<option value="${s}">${s}</option>`; });
            sMenu.disabled = false;

            document.getElementById('exportExcelBtn').disabled = false;
            alert(`File parsed successfully! Sync completed for ${data.length} student records.`);
        }

        // Generate unique technical hashed values so outcomes are non-repeating
        function produceUniqueHash(str, value) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return Math.abs(hash + value);
        }

        // 3. Dynamic Daily Lesson Learning outcome mapping dictionary
        function compileDailyVideoProgress(studentName, courseDomain, videoNumber) {
            const cClean = String(courseDomain).toLowerCase();
            const seedId = produceUniqueHash(studentName, videoNumber);
            
            let logDetails = { task: "", outcome: "" };

            if (cClean.includes('semiconductors') || cClean.includes('vlsi') || cClean.includes('embedded')) {
                const subModules = [
                    { t: "Analyzed deep sub-micron physical transistor layouts and gate geometry models.", o: "Understood drain-induced barrier lowering (DIBL) scaling dynamics and gate leakage reduction techniques." },
                    { t: "Designed behavioral architectures for synchronous pipeline registers and clock counters.", o: "Acquired competency in resolving setup/hold timing margin errors across high-frequency logic arrays." },
                    { t: "Simulated structural propagation path delays across complex domino logic trees in LTSpice.", o: "Calculated voltage transfer optimization curves and verified active power dissipation parameters." },
                    { t: "Configured modular finite state machine (FSM) control parameters inside Xilinx Vivado environment.", o: "Mastered synthesis constraints, clock skew mitigation steps, and multi-stage block optimizations." }
                ];
                let choice = subModules[seedId % subModules.length];
                logDetails.task = `Completed Video Lesson Module #${videoNumber}: ${choice.t}`;
                logDetails.outcome = `Successfully evaluated the concept. ${choice.o}`;
            } 
            else if (cClean.includes('pcb') || cClean.includes('layout') || cClean.includes('design')) {
                const subModules = [
                    { t: "Mapped schematic library footprint configurations for high-density multi-pin microprocessor modules.", o: "Mastered programmatic netlist synchronization constraints and custom component packaging rules." },
                    { t: "Executed high-frequency localized layout routing and configured custom differential trace paths.", o: "Acquired insights into reducing signal loop cross-talk properties and managing impedance match integrity parameters." },
                    { t: "Calculated multi-layer copper power rail thickness dimensions relative to strict temperature constraints.", o: "Understood advanced thermal dissipation grid patterns and plane insulation safety layers." },
                    { t: "Conducted automated Design Rule Checking (DRC) to discover board layer alignment mask issues.", o: "Resolved critical manufacturing spacing parameters and finalized production Gerber output packages." }
                ];
                let choice = subModules[seedId % subModules.length];
                logDetails.task = `Completed Video Lesson Module #${videoNumber}: ${choice.t}`;
                logDetails.outcome = `Successfully evaluated the concept. ${choice.o}`;
            } 
            else {
                // Internet of Things / Alternate Track Systems
                const subModules = [
                    { t: "Interfaced peripheral sensor instrumentation arrays with micro-controller interrupt lines.", o: "Understood analog-to-digital converter (ADC) sample filtering equations and register configuration parameters." },
                    { t: "Programmed low-power firmware routines using localized peripheral polling sleep cycles.", o: "Acquired insights into hardware clock prescaling configurations to maximize battery life metrics." },
                    { t: "Configured network communication architecture profiles using MQTT data routing structures.", o: "Mastered light payload publish-subscribe transmission pipelines across unsecured external client paths." },
                    { t: "Constructed structural JSON data packet schemas to stream telemetry arrays safely to cloud hubs.", o: "Evaluated transmission data rate optimization matrices and packet error detection algorithms." }
                ];
                let choice = subModules[seedId % subModules.length];
                logDetails.task = `Completed Video Lesson Module #${videoNumber}: ${choice.t}`;
                logDetails.outcome = `Successfully evaluated the concept. ${choice.o}`;
            }

            return logDetails;
        }

        // 4. Main Matrix Engine to build custom download files
        function processAndDownloadExcel() {
            const startVal = document.getElementById('fromDate').value;
            const endVal = document.getElementById('toDate').value;
            const chosenCourse = document.getElementById('courseFilter').value;
            const chosenStudent = document.getElementById('studentFilter').value;

            if (!startVal || !endVal) {
                alert("Please declare complete target filter date parameters.");
                return;
            }

            // Generate structural calendar date strings within bounds
            let chronologicalDates = [];
            let currentDayCursor = new Date(startVal);
            let absoluteEndDay = new Date(endVal);

            while (currentDayCursor <= absoluteEndDay) {
                chronologicalDates.push(new Date(currentDayCursor).toISOString().split('T')[0]);
                currentDayCursor.setDate(currentDayCursor.getDate() + 1);
            }

            // Create target Excel data rows matrix matching the schema order perfectly
            let structuralRowsForExcel = [];

            // CHRONOLOGICAL LOOP ORDER: Process Day 1 for all matching records first, then Day 2, etc.
            chronologicalDates.forEach((targetDate, dateIndex) => {
                
                // Track video iteration count across timeline sequence progression
                let associatedVideoNumber = dateIndex + 1; 

                masterSheetData.forEach(studentObj => {
                    let nameStr = studentObj[COL_NAME] ? String(studentObj[COL_NAME]).trim() : "";
                    let courseStr = studentObj[COL_COURSE] ? String(studentObj[COL_COURSE]).trim() : "";

                    let matchCourse = (chosenCourse === "All" || courseStr === chosenCourse);
                    let matchStudent = (chosenStudent === "All" || nameStr === chosenStudent);

                    if (nameStr && matchCourse && matchStudent) {
                        
                        // Extract localized technical text
                        let videoContent = compileDailyVideoProgress(nameStr, courseStr, associatedVideoNumber);

                        // Structure flat tracking object matching your raw file columns with new timeline data insertion
                        structuralRowsForExcel.push({
                            "Date Log": targetDate,
                            "Name of The Student": nameStr,
                            "Roll Number": studentObj[COL_ROLL] || "N/A",
                            "Year & Section": studentObj[COL_YEAR_SEC] || "N/A",
                            "Mail ID": studentObj[COL_MAIL] || "N/A",
                            "Mobile Number": studentObj[COL_PHONE] || "N/A",
                            "Online Certification Courses": courseStr,
                            "Case Study on SDG Topics Related to ECE": studentObj[COL_SDG] || "N/A",
                            "Daily Video Task Completed": videoContent.task,
                            "Concepts & Learnings Acquired": videoContent.outcome
                        });
                    }
                });
            });

            if (structuralRowsForExcel.length === 0) {
                alert("Zero records matched the defined filter variables. Please expand parameters.");
                return;
            }

            // 5. Compile SheetJS Binaries & Inject Clean Presentation Custom Colors
            const targetWorksheet = XLSX.utils.json_to_sheet(structuralRowsForExcel);
            const targetWorkbook = XLSX.utils.book_new();
            XLSX.book_append_sheet(targetWorkbook, targetWorksheet, "Daily Progress Report");

            // Auto-calculate structural text column widths dynamically for professional look
            const columnWidths = [
                { wch: 12 }, // Date Log
                { wch: 25 }, // Name of The Student
                { wch: 15 }, // Roll Number
                { wch: 15 }, // Year & Section
                { wch: 28 }, // Mail ID
                { wch: 15 }, // Mobile Number
                { wch: 38 }, // Online Certification Courses
                { wch: 30 }, // SDG Topics
                { wch: 42 }, // Daily Video Task Completed
                { wch: 55 }  // Concepts & Learnings Acquired
            ];
            targetWorksheet['!cols'] = columnWidths;

            // Trigger file download to browser instantly
            const timestampString = new Date().toISOString().slice(0,10);
            XLSX.writeFile(targetWorkbook, `ECE_III-I-C_Daily_Progress_Report_${timestampString}.xlsx`);
        }
    </script>
</body>
</html>
