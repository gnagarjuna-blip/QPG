<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Daily Report Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">

    <div class="max-w-6xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-3xl font-bold text-blue-700 mb-2 text-center">Student Daily Report Generator</h1>
        <p class="text-gray-500 text-center mb-8">Upload the Excel sheet to filter reports and generate HOD analytics.</p>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 p-4 bg-gray-100 rounded-lg">
            <div>
                <label class="block text-sm font-semibold mb-1">1. Upload Excel File</label>
                <input type="file" id="uploadFile" accept=".xlsx, .xls" class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">2. From Date</label>
                <input type="date" id="fromDate" class="w-full p-2 border rounded-md text-sm bg-white">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">3. To Date</label>
                <input type="date" id="toDate" class="w-full p-2 border rounded-md text-sm bg-white">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">4. Select Course</label>
                <select id="courseFilter" class="w-full p-2 border rounded-md text-sm bg-white" disabled>
                    <option value="All">All Courses</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 p-4 bg-gray-100 rounded-lg">
            <div>
                <label class="block text-sm font-semibold mb-1">5. Filter by Student (Optional)</label>
                <select id="studentFilter" class="w-full p-2 border rounded-md text-sm bg-white" disabled>
                    <option value="All">All Students (Overall Analytics)</option>
                </select>
            </div>
            <div class="flex items-end">
                <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition duration-200" disabled>
                    Generate Report & Analytics
                </button>
            </div>
        </div>

        <hr class="border-gray-200 mb-8">

        <div id="analyticsSection" class="hidden mb-10">
            <h2 class="text-2xl font-bold text-gray-700 mb-4">Visual Analytics (For HOD Submission)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center bg-gray-50 p-6 rounded-xl border border-gray-200">
                <div class="max-h-80 flex justify-center">
                    <canvas id="pieChart"></canvas>
                </div>
                <div class="max-h-80 flex justify-center">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

        <div id="reportSection" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-gray-700">Generated Daily Reports</h2>
                <button onclick="window.print()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm font-semibold shadow">
                    Print / Save as PDF
                </button>
            </div>
            <div class="overflow-x-auto border border-gray-200 rounded-lg">
                <table class="min-w-full divide-y divide-gray-200 text-sm text-left">
                    <thead class="bg-gray-50 text-gray-700 font-semibold">
                        <tr>
                            <th class="p-3">Date</th>
                            <th class="p-3">Student Name</th>
                            <th class="p-3">Course</th>
                            <th class="p-3">Daily Report / Tasks Completed</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody" class="divide-y divide-gray-200 bg-white">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let rawExcelData = [];
        let pieChartInstance = null;
        let barChartInstance = null;

        // Map your Excel columns here if headers are spelled differently
        const COL_NAME = "Student Name";
        const COL_COURSE = "Course";
        const COL_DATE = "Date";
        const COL_REPORT = "Daily Report";

        document.getElementById('uploadFile').addEventListener('change', handleFile, false);
        document.getElementById('generateBtn').addEventListener('click', generateReport, false);

        // 1. Read Excel File and populate Dropdowns
        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                
                // Read first sheet
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // Convert sheet to JSON
                rawExcelData = XLSX.utils.sheet_to_json(worksheet, {defval: ""});

                if(rawExcelData.length === 0) {
                    alert("The uploaded excel sheet seems empty!");
                    return;
                }

                populateFilters(rawExcelData);
            };
            reader.readAsArrayBuffer(file);
        }

        // 2. Populate Dropdowns dynamically based on Excel Data
        function populateFilters(data) {
            const courses = new Set();
            const students = new Set();

            data.forEach(row => {
                if(row[COL_COURSE]) courses.add(row[COL_COURSE].trim());
                if(row[COL_NAME]) students.add(row[COL_NAME].trim());
            });

            // Populate Courses
            const courseSelect = document.getElementById('courseFilter');
            courseSelect.innerHTML = '<option value="All">All Courses</option>';
            courses.forEach(c => courseSelect.innerHTML += `<option value="${c}">${c}</option>`);
            courseSelect.disabled = false;

            // Populate Students
            const studentSelect = document.getElementById('studentFilter');
            studentSelect.innerHTML = '<option value="All">All Students (Overall Analytics)</option>';
            students.forEach(s => studentSelect.innerHTML += `<option value="${s}">${s}</option>`);
            studentSelect.disabled = false;

            // Enable Generate Button
            document.getElementById('generateBtn').disabled = false;
            alert("Excel sheet uploaded and parsed successfully!");
        }

        // 3. Main Filter & Report Logic
        function generateReport() {
            const fromDateVal = document.getElementById('fromDate').value;
            const toDateVal = document.getElementById('toDate').value;
            const selectedCourse = document.getElementById('courseFilter').value;
            const selectedStudent = document.getElementById('studentFilter').value;

            // Filter standard logic
            let filteredData = rawExcelData.filter(row => {
                // Date parsing logic (handles JS Dates from SheetJS or strings)
                let rowDate = new Date(row[COL_DATE]);
                let matchesDate = true;

                if (fromDateVal) {
                    matchesDate = matchesDate && (rowDate >= new Date(fromDateVal + "T00:00:00"));
                }
                if (toDateVal) {
                    matchesDate = matchesDate && (rowDate <= new Date(toDateVal + "T23:59:59"));
                }

                // Course filtering
                let matchesCourse = (selectedCourse === "All" || (row[COL_COURSE] && row[COL_COURSE].trim() === selectedCourse));

                // Student filtering
                let matchesStudent = (selectedStudent === "All" || (row[COL_NAME] && row[COL_NAME].trim() === selectedStudent));

                return matchesDate && matchesCourse && matchesStudent;
            });

            if(filteredData.length === 0) {
                alert("No data records found for the selected criteria.");
                return;
            }

            renderTable(filteredData);
            renderCharts(filteredData, selectedStudent);
        }

        // 4. Render Table
        function renderTable(data) {
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = "";

            data.forEach(row => {
                let formattedDate = "";
                if(row[COL_DATE]) {
                    const d = new Date(row[COL_DATE]);
                    formattedDate = !isNaN(d) ? d.toLocaleDateString() : row[COL_DATE];
                }

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-medium whitespace-nowrap">${formattedDate}</td>
                    <td class="p-3 font-semibold text-blue-900">${row[COL_NAME] || 'N/A'}</td>
                    <td class="p-3 text-gray-600">${row[COL_COURSE] || 'N/A'}</td>
                    <td class="p-3 bg-gray-50/50">${row[COL_REPORT] || '<span class="text-red-400 italic">No report submitted</span>'}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('reportSection').classList.remove('hidden');
        }

        // 5. Render Analytics Charts (Pie and Bar Chart)
        function renderCharts(data, selectedStudent) {
            document.getElementById('analyticsSection').classList.remove('hidden');

            let chartLabels = [];
            let chartDataValues = [];
            let pieTitle = "";
            let barTitle = "";

            if (selectedStudent === "All") {
                // Scenario A: Overall Analytics (Distribution of Reports turned in per Course)
                pieTitle = "Report Submissions Split by Course";
                barTitle = "Total Submissions per Course";
                
                let courseCounts = {};
                data.forEach(row => {
                    let course = row[COL_COURSE] || "Unknown Course";
                    courseCounts[course] = (courseCounts[course] || 0) + 1;
                });

                chartLabels = Object.keys(courseCounts);
                chartDataValues = Object.values(courseCounts);
            } else {
                // Scenario B: Single Student Analytics (Submissions metric tracker split by Date)
                pieTitle = `Report Distribution for ${selectedStudent}`;
                barTitle = "Submissions Timeline Tracker";
                
                let dateCounts = {};
                data.forEach(row => {
                    let d = new Date(row[COL_DATE]);
                    let dateStr = !isNaN(d) ? d.toLocaleDateString() : "Unknown Date";
                    dateCounts[dateStr] = (dateCounts[dateStr] || 0) + 1;
                });

                chartLabels = Object.keys(dateCounts);
                chartDataValues = Object.values(dateCounts);
            }

            // Destroy previous instances to prevent chart glitches on hover/re-render
            if (pieChartInstance) pieChartInstance.destroy();
            if (barChartInstance) barChartInstance.destroy();

            const colors = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899', '#6366F1'];

            // Build Pie Chart
            const ctxPie = document.getElementById('pieChart').getContext('2d');
            pieChartInstance = new Chart(ctxPie, {
                type: 'pie',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        data: chartDataValues,
                        backgroundColor: colors.slice(0, chartLabels.length)
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' },
                        title: { display: true, text: pieTitle, font: { size: 16 } }
                    }
                }
            });

            // Build Bar Chart
            const ctxBar = document.getElementById('barChart').getContext('2d');
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Number of Daily Reports',
                        data: chartDataValues,
                        backgroundColor: '#3B82F6',
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: barTitle, font: { size: 16 } }
                    }
                }
            });
        }
    </script>
</body>
</html>
